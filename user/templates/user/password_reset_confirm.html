{% extends "base.html" %}
{% block content %}
  <h2 style="color:#ff1493;">Новый пароль</h2>
  <p>Введите новый пароль два раза.</p>

  <form method="post" style="max-width:400px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit"
            style="background:#ff1493;color:white;padding:8px 16px;border:none;border-radius:5px;cursor:pointer;">
      Сохранить пароль
    </button>
  </form>
{% endblock %}
