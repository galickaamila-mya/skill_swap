{% extends 'base.html' %}
{% block content %}
<h2>Мой профиль</h2>
{% if profile.average_rating %}
<p>Средний рейтинг: <strong>{{ profile.average_rating }}</strong> / 5</p>
{% endif %}
<form method="post" enctype="multipart/form-data" class="col-md-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
<p class="mt-3"><a href="{% url 'user:account_settings' %}">Управление аккаунтом</a></p>
{% endblock %}
